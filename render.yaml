# Render blueprint for the REMI platform.
#
# Only the API is deployed here. The three Next.js frontends (apps/web on :3010,
# apps/admin on :3011, apps/member on :3012) are deployed separately (e.g. Vercel) — Render's Node
# runtime has no pnpm-monorepo story worth encoding here. Their
# NEXT_PUBLIC_API_URL must point at this service's public URL, and
# CORS_ORIGINS below must list theirs.
#
# MongoDB is external (Atlas or similar): paste its connection string into the
# MONGODB_URI secret in the Render dashboard after the first sync.
services:
  - type: web
    name: remi-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - render.yaml
    envVars:
      # Render injects PORT; the server already honours it.
      - key: APP_ENV
        value: production
      - key: MONGODB_URI # external MongoDB connection string, incl. db name
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS # comma-separated web/admin/member origins
        value: https://remi.vercel.app,https://remi-admin.vercel.app,https://remi-member.vercel.app
      - key: ADMIN_APP_URL # invitation links
        value: https://remi-admin.vercel.app
      - key: MEMBER_APP_URL # member invitation links
        value: https://remi-member.vercel.app
      - key: PUBLIC_WEB_URL # signed communication preference links
        value: https://remi.vercel.app
      - key: SEED_ADMIN_EMAIL
        value: admin@remi.church
      - key: SEED_ADMIN_PASSWORD
        value: remi-admin-2026
      # Optional integrations — the API runs in demo mode without them.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: REMI Church <noreply@remi.church>
      - key: NOTIFY_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: SMS_SENDER
        value: REMI
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v23.0
      - key: COMMUNICATION_WEBHOOK_SECRET # configure the same secret in the provider webhook adapter
        generateValue: true
