name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval db.adminCommand('ping')"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Vet
        working-directory: apps/api
        run: go vet ./...

      # REQUIRE_INFRA turns an unreachable MongoDB into a failure rather than
      # a skip, so this job cannot pass having run no integration tests.
      - name: Test
        working-directory: apps/api
        env:
          REQUIRE_INFRA: "1"
          MONGODB_URI: mongodb://localhost:27017
        run: go test ./...

      - name: Build
        working-directory: apps/api
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so Node's pnpm cache can
      # resolve the executable. The action reads the exact version from the
      # root packageManager field, keeping CI and Vercel on the same release.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter web build

      - name: Build admin
        run: pnpm --filter admin build

      - name: Typecheck admin
        run: pnpm --filter admin typecheck
